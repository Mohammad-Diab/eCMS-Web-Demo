"/><text x="640" y="380" text-anchor="end" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="20" font-weight="400" fill="#222">الكولسترول الكلي</text><text x="330" y="380" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="20" font-weight="400" fill="#222">186 mg/dL</text><text x="130" y="380" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#555">&lt; 200</text><line x1="50" y1="400" x2="650" y2="400" stroke="#ddd"/><text x="640" y="440" text-anchor="end" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="20" font-weight="400" fill="#222">الكرياتينين</text><text x="330" y="440" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="20" font-weight="400" fill="#222">0.9 mg/dL</text><text x="130" y="440" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#555">0.6 - 1.2</text><line x1="50" y1="460" x2="650" y2="460" stroke="#ddd"/><g transform="rotate(-18 350.0 450.0)" opacity="0.18"><text x="350.0" y="450.0" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="77" font-weight="700" fill="#c00">نموذج تجريبي</text></g><text x="350.0" y="882" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#888">صورة تجريبية بيانات وهمية - eCMS Clinic demo</text>
